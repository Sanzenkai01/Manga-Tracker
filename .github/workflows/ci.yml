name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17 and cache Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests, lint, and debug assembly
        run: ./gradlew :core:localization:test :core:data:testDebugUnitTest :core:parser-engine:test :parsers:site-adapters:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
